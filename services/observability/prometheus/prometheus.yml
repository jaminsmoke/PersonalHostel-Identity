global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: identity-camareros
    metrics_path: /metrics
    static_configs:
      - targets: ["identity-camareros:8081"]

  - job_name: identity-negocio
    metrics_path: /metrics
    static_configs:
      - targets: ["identity-negocio:8081"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
