server:
  http_listen_port: 9080
  grpc_listen_port: 0

# En modo transitorio (--config.format=promtail) Alloy ignora `positions`:
# guarda su checkpoint en --storage.path (volumen alloy-data), no en este fichero.

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets: [localhost]
        labels:
          job: containers
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      # Parsea el formato json-file de Docker y deja el contenido real de la
      # línea (nuestro access log JSON) como línea de log para Loki.
      - docker: {}
