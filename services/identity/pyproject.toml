[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
# SQLAlchemy persiste estos enums por nombre; migrarlos a StrEnum requiere una
# migración de datos y de contrato independiente, no una corrección de estilo.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
junit_family = "xunit2"
junit_duration_report = "call"

[tool.coverage.run]
branch = true
source = ["app"]
relative_files = true

[tool.coverage.report]
fail_under = 82
precision = 2
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
