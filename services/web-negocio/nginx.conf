server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /stubs/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Manifiesto de la SPA: sin caché. Si se cachea, el QR de Bar pinta un
    # /assets/index-<hash-viejo>.js (immutable 1 año) hasta recargar.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
    }
}