services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hosteleria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devlocal}
      POSTGRES_DB: ${POSTGRES_DB:-identity}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hosteleria} -d ${POSTGRES_DB:-identity}"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    build: ./services/identity
    ports:
      - "${IDENTITY_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/${POSTGRES_DB:-identity}
      FOTOS_DIR: /app/data/fotos
      IDENTITY_WEB_ORIGIN: ${IDENTITY_WEB_ORIGIN:-http://localhost:8081}
      INVITATION_URL_BASE: ${INVITATION_URL_BASE:-http://localhost:8081/invitaciones}
    volumes:
      - fotos:/app/data/fotos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  email-worker:
    build: ./services/identity
    command: ["python", "-m", "app.email_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/${POSTGRES_DB:-identity}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.test}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
    depends_on:
      identity:
        condition: service_healthy

  identity-web:
    build: ./services/identity-web
    ports:
      - "${IDENTITY_WEB_PORT:-8081}:80"
    environment:
      IDENTITY_API_URL: ${IDENTITY_API_URL:-http://localhost:8080}
    depends_on:
      identity:
        condition: service_healthy

volumes:
  pgdata:
  fotos:
