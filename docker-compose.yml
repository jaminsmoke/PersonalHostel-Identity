services:
  db:
    image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hosteleria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devlocal}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/identity/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hosteleria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-camareros:
    build:
      context: ./services/identity
      target: runtime
    ports:
      - "${IDENTITY_PORT:-8080}:8080"
    environment:
      CAMAREROS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_camareros
      NEGOCIO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_negocio
      SESSION_SECRET: ${SESSION_SECRET:-BdZh-Awc4rEhsHCtzyUoufxqf7mT97y68QhilC9fxVnszS4CFmICrNRncw7vVeN2}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:-osYIdBW7fkucKVqY9St5yQKpLpDuAzJ4PeRaFMXbtDI=}
      FOTOS_DIR: /app/data/fotos
      INTERNAL_TRANSPORT: http
      NEGOCIO_INTERNAL_URL: http://identity-negocio:8080
      ALLOW_NON_REAL_DATA: ${ALLOW_NON_REAL_DATA:-true}
      IDENTITY_WEB_ORIGIN: ${IDENTITY_WEB_ORIGIN:-http://localhost:8081,http://localhost:8084}
      FICHA_URL_BASE: ${FICHA_URL_BASE:-http://localhost:8084}
    volumes:
      - fotos:/app/data/fotos
    depends_on:
      db:
        condition: service_healthy
      fotos-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  identity-negocio:
    build:
      context: ./services/identity
      target: runtime
    ports:
      - "${NEGOCIO_PORT:-8082}:8080"
    environment:
      SERVICE: negocio
      NEGOCIO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_negocio
      CAMAREROS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_camareros
      SESSION_SECRET: ${SESSION_SECRET:-BdZh-Awc4rEhsHCtzyUoufxqf7mT97y68QhilC9fxVnszS4CFmICrNRncw7vVeN2}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:-osYIdBW7fkucKVqY9St5yQKpLpDuAzJ4PeRaFMXbtDI=}
      FOTOS_DIR: /app/data/fotos
      INTERNAL_TRANSPORT: http
      CAMAREROS_INTERNAL_URL: http://identity-camareros:8080
      IDENTITY_WEB_ORIGIN: ${IDENTITY_WEB_ORIGIN:-http://localhost:8081,http://localhost:8083}
      INVITATION_URL_BASE: ${INVITATION_URL_BASE:-http://localhost:8081/invitaciones}
      WEB_NEGOCIO_URL_BASE: ${WEB_NEGOCIO_URL_BASE:-http://localhost:8083}
      ALLOW_NON_REAL_DATA: ${ALLOW_NON_REAL_DATA:-true}
    volumes:
      - fotos:/app/data/fotos
    depends_on:
      db:
        condition: service_healthy
      fotos-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  email-worker:
    build:
      context: ./services/identity
      target: runtime
    environment:
      SERVICE: email-worker
      NEGOCIO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_negocio
      SESSION_SECRET: ${SESSION_SECRET:-BdZh-Awc4rEhsHCtzyUoufxqf7mT97y68QhilC9fxVnszS4CFmICrNRncw7vVeN2}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.test}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
    depends_on:
      identity-negocio:
        condition: service_healthy

  fotos-permissions:
    build:
      context: ./services/identity
      target: runtime
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /app/data/fotos"]
    volumes:
      - fotos:/app/data/fotos
    restart: "no"

  reports-permissions:
    profiles: ["test"]
    build:
      context: ./services/identity
      target: runtime
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /reports"]
    volumes:
      - ./build/reports:/reports
    restart: "no"

  identity-tests:
    profiles: ["test"]
    build:
      context: ./services/identity
      target: test
    environment:
      CAMAREROS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_camareros
      NEGOCIO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_negocio
      SESSION_SECRET: ${SESSION_SECRET:-BdZh-Awc4rEhsHCtzyUoufxqf7mT97y68QhilC9fxVnszS4CFmICrNRncw7vVeN2}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:-osYIdBW7fkucKVqY9St5yQKpLpDuAzJ4PeRaFMXbtDI=}
      FOTOS_DIR: /tmp/identity-test-fotos
      OPENAPI_DOCS_DIR: /docs
      RUFF_CACHE_DIR: /tmp/ruff-cache
      PYTEST_ADDOPTS: -o cache_dir=/tmp/pytest-cache
      COVERAGE_FILE: /tmp/.coverage
      INTERNAL_TRANSPORT: direct
      ALLOW_NON_REAL_DATA: "true"
      WEB_NEGOCIO_URL_BASE: http://localhost:8083
    command:
      - python
      - -m
      - pytest
      - tests
      - -v
      - --junitxml=/reports/junit.xml
      - --cov=app
      - --cov-branch
      - --cov-report=term-missing
      - --cov-report=xml:/reports/coverage.xml
      - --cov-report=html:/reports/htmlcov
      - --cov-report=markdown:/reports/coverage.md
    volumes:
      - ./services/identity:/app
      - ./docs:/docs:ro
      - ./build/reports:/reports
    depends_on:
      db:
        condition: service_healthy
      reports-permissions:
        condition: service_completed_successfully

  identity-web:
    build: ./services/identity-web
    ports:
      - "${IDENTITY_WEB_PORT:-8081}:8080"
    environment:
      IDENTITY_API_URL: ${IDENTITY_API_URL:-http://localhost:8082}
    depends_on:
      identity-negocio:
        condition: service_healthy

  web-negocio:
    build: ./services/web-negocio
    ports:
      - "${WEB_NEGOCIO_PORT:-8083}:8080"
    environment:
      NEGOCIO_API_URL: ${NEGOCIO_API_URL:-http://localhost:8082}
    depends_on:
      identity-negocio:
        condition: service_healthy

  web-camareros:
    build: ./services/web-camareros
    ports:
      - "${WEB_CAMAREROS_PORT:-8084}:8080"
    environment:
      CAMAREROS_API_URL: ${CAMAREROS_API_URL:-http://localhost:8080}
    depends_on:
      identity-camareros:
        condition: service_healthy

volumes:
  pgdata:
  fotos:
