services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hosteleria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devlocal}
      POSTGRES_DB: ${POSTGRES_DB:-identity}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hosteleria} -d ${POSTGRES_DB:-identity}"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    build: ./services/identity
    ports:
      - "${IDENTITY_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/${POSTGRES_DB:-identity}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
