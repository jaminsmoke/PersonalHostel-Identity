name: Integration check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare report directory
        run: mkdir -p build/reports
      - name: Build and start Identity with PostgreSQL 16
        run: docker compose up -d --build identity-camareros identity-negocio
      - name: Build isolated test runner
        run: docker compose build identity-tests
      - name: Run tests with branch coverage
        run: docker compose run --rm identity-tests
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f build/reports/coverage.md ]; then
            cat build/reports/coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Audit the clean development databases
        run: docker compose exec -T identity-camareros python -m app.data_audit --format json --fail-on-detected
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-test-reports
          path: build/reports
          if-no-files-found: warn
          retention-days: 14
      - name: Stop ephemeral services
        if: always()
        run: docker compose down -v
