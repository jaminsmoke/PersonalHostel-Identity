name: Quality check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/identity/requirements*.txt
      - name: Install quality dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check --output-format=github app tests scripts
      - name: Check Python formatting
        run: ruff format --check app tests scripts
      - name: Check OpenAPI specs are in sync
        run: python scripts/export_openapi.py --check
