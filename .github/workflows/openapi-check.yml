name: OpenAPI check

on:
  push:
  pull_request:

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r services/identity/requirements.txt
      - name: Check OpenAPI spec is in sync
        run: python services/identity/scripts/export_openapi.py --check
