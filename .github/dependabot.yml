version: 2
updates:
  - package-ecosystem: pip
    directory: /services/identity
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, security]
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /services/identity
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies, security]

  - package-ecosystem: docker
    directory: /services/identity-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies, security]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies, security]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies, security]
    groups:
      github-actions:
        patterns: ["*"]
